<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Plex Sync</title>
  <style>
    body { padding: 16px; margin: 0; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
    .row { margin-bottom: 10px; }
    .help { font-size: 11px; opacity: .6; margin: 2px 0 0 22px; }
    input[type=number] { width: 56px; }
  </style>
</head>
<body>
  <p class="row" style="opacity:.75">
    Only active for Plex links opened from Plex Web with tracking switched on.
    Other files are never reported to Plex.
  </p>
  <div class="row">
    <label><input type="checkbox" data-pref-key="resume" /> Resume where Plex left off</label>
  </div>
  <div class="row">
    <label><input type="checkbox" data-pref-key="osd" /> On-screen messages (tracking on, resuming, watched)</label>
  </div>
  <div class="row">
    Mark as watched at
    <input type="number" min="50" max="100" data-pref-key="threshold" data-type="int" /> %
    <div class="help">Use the same value as your Plex server's "Video played threshold" (Settings › Library).</div>
  </div>
  <div class="row">
    Send the position to Plex every
    <input type="number" min="5" max="60" data-pref-key="interval" data-type="int" /> s
  </div>
</body>
</html>
